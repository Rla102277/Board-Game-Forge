services:
  - type: web
    name: gameforge-api
    runtime: node
    buildCommand: corepack enable && corepack prepare pnpm@10.33.2 --activate && pnpm install --no-frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: node artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GAMMA_API_KEY
        sync: false
      - key: PORT
        value: "8080"

  - type: web
    name: gameforge-web
    runtime: node
    buildCommand: corepack enable && corepack prepare pnpm@10.33.2 --activate && pnpm install --no-frozen-lockfile && pnpm --filter @workspace/gameforge run build
    startCommand: pnpm --filter @workspace/gameforge exec vite preview --config artifacts/gameforge/vite.config.ts --host 0.0.0.0 --port $PORT
    envVars:
      - key: BASE_PATH
        value: "/"
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: VITE_API_URL
        value: https://gameforge-api.onrender.com
