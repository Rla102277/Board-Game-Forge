services:
  - type: web
    name: tableforgeapi
    runtime: node
    buildCommand: npm install --prefix $HOME/.npm-global pnpm && export PATH=$HOME/.npm-global/bin:$PATH && pnpm install --no-frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: node artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: AI_INTEGRATIONS_ANTHROPIC_BASE_URL
        sync: false
      - key: AI_INTEGRATIONS_ANTHROPIC_API_KEY
        sync: false
      - key: AI_INTEGRATIONS_OPENAI_BASE_URL
        sync: false
      - key: AI_INTEGRATIONS_OPENAI_API_KEY
        sync: false
      - key: AI_INTEGRATIONS_GEMINI_BASE_URL
        sync: false
      - key: AI_INTEGRATIONS_GEMINI_API_KEY
        sync: false
      - key: AI_INTEGRATIONS_OPENROUTER_BASE_URL
        sync: false
      - key: AI_INTEGRATIONS_OPENROUTER_API_KEY
        sync: false
      - key: GAMMA_API_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: PORT
        value: "8080"

  - type: web
    name: tableforgeweb
    runtime: node
    buildCommand: npm install --prefix $HOME/.npm-global pnpm && export PATH=$HOME/.npm-global/bin:$PATH && pnpm install --no-frozen-lockfile && pnpm --filter @workspace/gameforge run build
    startCommand: pnpm --filter @workspace/gameforge exec vite preview --host 0.0.0.0 --port $PORT
    envVars:
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: VITE_API_URL
        value: https://tableforgeapi.onrender.com
