openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: GameForge API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: projects
    description: Board game project operations
  - name: entities
    description: Game entity operations
  - name: rules
    description: Game rule operations
  - name: players
    description: Player archetype operations
  - name: notes
    description: Design note operations
  - name: tasks
    description: Task board operations
  - name: chat
    description: AI chat operations
  - name: dashboard
    description: Dashboard summary operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Aggregate dashboard statistics across all projects
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Recent activity across projects
      responses:
        "200":
          description: List of recent activity events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityEvent"

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all board game projects
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a board game project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectBody"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{projectId}:
    get:
      operationId: getProject
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProject
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectBody"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteProject
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "204":
          description: Deleted

  /projects/{projectId}/stats:
    get:
      operationId: getProjectStats
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectStats"

  /projects/{projectId}/entities:
    get:
      operationId: listEntities
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Entity list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Entity"
    post:
      operationId: createEntity
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEntityBody"
      responses:
        "201":
          description: Created entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entity"

  /projects/{projectId}/entities/{entityId}:
    patch:
      operationId: updateEntity
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/EntityId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEntityBody"
      responses:
        "200":
          description: Updated entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entity"
    delete:
      operationId: deleteEntity
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/EntityId"
      responses:
        "204":
          description: Deleted

  /projects/{projectId}/entities/ai-generate:
    post:
      operationId: aiGenerateEntities
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiGenerateBody"
      responses:
        "200":
          description: Generated entities (saved to project)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Entity"

  /projects/{projectId}/rules:
    get:
      operationId: listRules
      tags: [rules]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Rule list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Rule"
    post:
      operationId: createRule
      tags: [rules]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRuleBody"
      responses:
        "201":
          description: Created rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"

  /projects/{projectId}/rules/{ruleId}:
    patch:
      operationId: updateRule
      tags: [rules]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RuleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRuleBody"
      responses:
        "200":
          description: Updated rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
    delete:
      operationId: deleteRule
      tags: [rules]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RuleId"
      responses:
        "204":
          description: Deleted

  /projects/{projectId}/rules/ai-generate:
    post:
      operationId: aiGenerateRules
      tags: [rules]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiGenerateBody"
      responses:
        "200":
          description: Generated rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Rule"

  /projects/{projectId}/players:
    get:
      operationId: listPlayers
      tags: [players]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Player list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Player"
    post:
      operationId: createPlayer
      tags: [players]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlayerBody"
      responses:
        "201":
          description: Created player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"

  /projects/{projectId}/players/{playerId}:
    patch:
      operationId: updatePlayer
      tags: [players]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/PlayerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlayerBody"
      responses:
        "200":
          description: Updated player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
    delete:
      operationId: deletePlayer
      tags: [players]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/PlayerId"
      responses:
        "204":
          description: Deleted

  /projects/{projectId}/notes:
    get:
      operationId: listNotes
      tags: [notes]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Note list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Note"
    post:
      operationId: createNote
      tags: [notes]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNoteBody"
      responses:
        "201":
          description: Created note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"

  /projects/{projectId}/notes/{noteId}:
    patch:
      operationId: updateNote
      tags: [notes]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/NoteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNoteBody"
      responses:
        "200":
          description: Updated note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
    delete:
      operationId: deleteNote
      tags: [notes]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/NoteId"
      responses:
        "204":
          description: Deleted

  /projects/{projectId}/tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Task list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskBody"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /projects/{projectId}/tasks/{taskId}:
    patch:
      operationId: updateTask
      tags: [tasks]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskBody"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    delete:
      operationId: deleteTask
      tags: [tasks]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/TaskId"
      responses:
        "204":
          description: Deleted

  /projects/{projectId}/chat:
    get:
      operationId: listChatMessages
      tags: [chat]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Chat history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"
    delete:
      operationId: clearChatMessages
      tags: [chat]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "204":
          description: Cleared

  /projects/{projectId}/chat/send:
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: Send a chat message and stream the AI response (SSE)
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendChatMessageBody"
      responses:
        "200":
          description: SSE stream of assistant response chunks
          content:
            text/event-stream: {}

components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: integer
    EntityId:
      name: entityId
      in: path
      required: true
      schema:
        type: integer
    RuleId:
      name: ruleId
      in: path
      required: true
      schema:
        type: integer
    PlayerId:
      name: playerId
      in: path
      required: true
      schema:
        type: integer
    NoteId:
      name: noteId
      in: path
      required: true
      schema:
        type: integer
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: integer

  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    Project:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: [string, "null"]
        gameType:
          type: [string, "null"]
        genre:
          type: [string, "null"]
        playerCount:
          type: [string, "null"]
        targetDuration:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, name, createdAt, updatedAt]

    CreateProjectBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        gameType:
          type: string
        genre:
          type: string
        playerCount:
          type: string
        targetDuration:
          type: string
      required: [name]

    UpdateProjectBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        gameType:
          type: string
        genre:
          type: string
        playerCount:
          type: string
        targetDuration:
          type: string

    ProjectStats:
      type: object
      properties:
        entityCount:
          type: integer
        ruleCount:
          type: integer
        playerCount:
          type: integer
        noteCount:
          type: integer
        taskCount:
          type: integer
        chatMessageCount:
          type: integer
      required:
        - entityCount
        - ruleCount
        - playerCount
        - noteCount
        - taskCount
        - chatMessageCount

    DashboardSummary:
      type: object
      properties:
        projectCount:
          type: integer
        entityCount:
          type: integer
        ruleCount:
          type: integer
        chatMessageCount:
          type: integer
        gameTypeBreakdown:
          type: array
          items:
            type: object
            properties:
              gameType:
                type: string
              count:
                type: integer
            required: [gameType, count]
        genreBreakdown:
          type: array
          items:
            type: object
            properties:
              genre:
                type: string
              count:
                type: integer
            required: [genre, count]
      required:
        - projectCount
        - entityCount
        - ruleCount
        - chatMessageCount
        - gameTypeBreakdown
        - genreBreakdown

    ActivityEvent:
      type: object
      properties:
        id:
          type: string
        projectId:
          type: integer
        projectName:
          type: string
        kind:
          type: string
        title:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, projectId, projectName, kind, title, createdAt]

    Entity:
      type: object
      properties:
        id:
          type: integer
        projectId:
          type: integer
        name:
          type: string
        type:
          type: string
        description:
          type: [string, "null"]
        stats:
          type: [string, "null"]
        color:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, projectId, name, type, createdAt, updatedAt]

    CreateEntityBody:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        description:
          type: string
        stats:
          type: string
        color:
          type: string
      required: [name, type]

    UpdateEntityBody:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        description:
          type: string
        stats:
          type: string
        color:
          type: string

    Rule:
      type: object
      properties:
        id:
          type: integer
        projectId:
          type: integer
        title:
          type: string
        content:
          type: string
        category:
          type: [string, "null"]
        priority:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, projectId, title, content, priority, createdAt, updatedAt]

    CreateRuleBody:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        category:
          type: string
        priority:
          type: integer
      required: [title, content]

    UpdateRuleBody:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        category:
          type: string
        priority:
          type: integer

    Player:
      type: object
      properties:
        id:
          type: integer
        projectId:
          type: integer
        name:
          type: string
        role:
          type: [string, "null"]
        description:
          type: [string, "null"]
        strategy:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, projectId, name, createdAt, updatedAt]

    CreatePlayerBody:
      type: object
      properties:
        name:
          type: string
        role:
          type: string
        description:
          type: string
        strategy:
          type: string
      required: [name]

    UpdatePlayerBody:
      type: object
      properties:
        name:
          type: string
        role:
          type: string
        description:
          type: string
        strategy:
          type: string

    Note:
      type: object
      properties:
        id:
          type: integer
        projectId:
          type: integer
        title:
          type: [string, "null"]
        content:
          type: [string, "null"]
        color:
          type: [string, "null"]
        pinned:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, projectId, pinned, createdAt, updatedAt]

    CreateNoteBody:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        color:
          type: string
        pinned:
          type: boolean

    UpdateNoteBody:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        color:
          type: string
        pinned:
          type: boolean

    Task:
      type: object
      properties:
        id:
          type: integer
        projectId:
          type: integer
        title:
          type: string
        description:
          type: [string, "null"]
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, projectId, title, status, createdAt, updatedAt]

    CreateTaskBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        status:
          type: string
      required: [title]

    UpdateTaskBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        status:
          type: string

    ChatMessage:
      type: object
      properties:
        id:
          type: integer
        projectId:
          type: integer
        role:
          type: string
        content:
          type: string
        gameType:
          type: [string, "null"]
        genre:
          type: [string, "null"]
        model:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
      required: [id, projectId, role, content, createdAt]

    SendChatMessageBody:
      type: object
      properties:
        content:
          type: string
        gameType:
          type: string
        genre:
          type: string
        model:
          type: string
      required: [content]

    AiGenerateBody:
      type: object
      properties:
        prompt:
          type: string
        count:
          type: integer
      required: [prompt]
