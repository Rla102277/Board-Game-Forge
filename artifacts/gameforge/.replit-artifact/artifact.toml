kind = "web"
previewPath = "/"
title = "GameForge — Board Game Studio"
version = "1.0.0"
id = "artifacts/gameforge"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25201

[services.development]
run = "pnpm --filter @workspace/gameforge run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gameforge", "run", "build" ]
publicDir = "artifacts/gameforge/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25201"
BASE_PATH = "/"
